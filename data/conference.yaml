about: |
  <p>У Java-сообщества Сибири есть традиция: раз в год собираемся офлайн в Новосибирске и говорим про Java и JVM — это то, что мы любим, практикуем, хотим и можем развивать.</p>
  <p><strong>27 февраля</strong> на SnowOne 2026 студенческий день — студенты любых вузов участвуют бесплатно. Достаточно зарегистрироваться и показать студенческий на площадке конференции. Выступления этого дня не будут привязаны к Java — спикеры охватят широкий круг тем в IT: от верификации кода ОС до особенностей работы технических писателей. Простым языком расскажут, как устроена индустрия разработки.</p>
  <p><strong>28 февраля</strong> — день для всех. Доклады — хардкорные, атмосфера — ламповая.</p>
  <p>Организатор конференции — JUGNsk.</p>
