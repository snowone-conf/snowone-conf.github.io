# Соответствие колонок выгрузки Яндекс Форм полям сайта (для tools/import_cfp.py).
#
# Слева — поле сайта, справа — заголовок колонки в выгрузке (текст вопроса формы)
# или список вариантов заголовков: берётся первый найденный. Регистр и пробелы
# по краям не важны. Если вопросы в форме поменялись — правьте только этот файл.
#
# Поля, которых нет в этом файле (e-mail, телефон, комментарии для ПК), в сайт
# не попадают никогда.

# Уникальный номер ответа — по нему работает --only
id: [ID, "№", Номер ответа]

talk:
  title: [Название доклада, Тема доклада]
  summary: [Краткое описание, Аннотация (коротко), Короткое описание доклада]
  description: [Описание доклада, Подробное описание, Аннотация]
  language: [Язык доклада, Язык]          # значения: «Русский» / «English»
  format: [Формат, Формат выступления]     # «Доклад», «Воркшоп», «Обсуждение»

# Докладчики: одна строка выгрузки может содержать несколько докладчиков.
speakers:
  - name: [Имя и фамилия, ФИО, Имя и фамилия спикера]
    company: [Компания, Место работы]
    position: [Должность]
    bio: [О себе, Биография, Расскажите о себе]
    photo: [Фото, Ссылка на фото, Фотография]
    telegram: [Telegram, Телеграм]
    github: [GitHub]
    website: [Сайт, Блог]
  - name: [Имя и фамилия второго спикера, ФИО второго спикера]
    company: [Компания второго спикера]
    position: [Должность второго спикера]
    bio: [О втором спикере, Биография второго спикера]
    photo: [Фото второго спикера]
    telegram: [Telegram второго спикера]
    github: [GitHub второго спикера]
    website: [Сайт второго спикера]
