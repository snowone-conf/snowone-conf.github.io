# Публикует статическую копию сайта (snapshot/) в GitHub Pages.
# Когда появится Hugo-версия, здесь добавится шаг сборки.
name: Deploy to GitHub Pages

on:
  push:
    paths-ignore: [docs/**, "*.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Публикуем только из ветки по умолчанию, как бы она ни называлась.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: snapshot
      - id: deployment
        uses: actions/deploy-pages@v4
