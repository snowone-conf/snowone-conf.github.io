# Приём в программу: PR со страницами спикера и выступления из карточки Trello.
# Запуск — сервис cfp-function, когда карточку переносят в «Приняли в программу» (repository_dispatch),
# или вручную: Actions → CFP: приём в программу → Run workflow, ссылка на карточку.
# PR собирается из текущего описания карточки (tools/cfp_from_trello.py), без draft и без расписания.
# Если PR по заявке уже открыт, он не пересобирается — нужен ручной запуск с «пересоздать».
#
# Секреты: TRELLO_KEY, TRELLO_TOKEN (служебный аккаунт Trello), EVENTS_SECRET (общий с cfp-function).
# Переменная: CFP_SERVICE_URL — адрес cfp-function, туда уходят события для сообщений в чат ПК.
name: "CFP: приём в программу"

on:
  repository_dispatch:
    types: [cfp-accept]
  workflow_dispatch:
    inputs:
      card:
        description: Ссылка на карточку Trello или её короткий код
        required: true
      recreate:
        description: Пересоздать PR из текущей карточки, даже если он уже есть
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cfp-accept-${{ github.event.client_payload.card || inputs.card }}

jobs:
  accept:
    runs-on: ubuntu-latest
    env:
      CARD: ${{ github.event.client_payload.card || inputs.card }}
      RECREATE: ${{ inputs.recreate || false }}
      TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
      TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
      EVENTS_SECRET: ${{ secrets.EVENTS_SECRET }}
      CFP_SERVICE_URL: ${{ vars.CFP_SERVICE_URL }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SUMMARY: /tmp/cfp-summary.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Install Hugo and PyYAML
        run: |
          v=$(cat .hugo-version)
          curl -fsSL -o /tmp/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${v}/hugo_extended_${v}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          pip install --quiet pyyaml

      - name: Pages from the card
        run: python3 tools/cfp_from_trello.py build --card "$CARD" --summary "$SUMMARY"

      - name: Existing PR
        id: existing
        run: |
          branch=$(jq -r .branch "$SUMMARY")
          pr=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // ""')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -n "$pr" ] && [ "$RECREATE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Remind about the existing PR
        if: steps.existing.outputs.skip == 'true'
        env:
          PR: ${{ steps.existing.outputs.pr }}
        run: |
          python3 tools/cfp_from_trello.py comment --card "$CARD" \
            --text "PR по этой заявке уже есть: $PR. Чтобы пересобрать его из текущей карточки, запустите cfp-accept вручную с флагом «пересоздать»: $RUN_URL"
          jq -n --slurpfile s "$SUMMARY" --arg pr "$PR" \
            '{kind: "pr-exists", title: $s[0].title, cardUrl: $s[0].cardUrl, prUrl: $pr}' > /tmp/event.json
          curl -fsS -X POST -H "Authorization: Bearer $EVENTS_SECRET" -H "Content-Type: application/json" \
            --data @/tmp/event.json "$CFP_SERVICE_URL/api/events"

      - name: Site checks
        if: steps.existing.outputs.skip != 'true'
        run: |
          python3 tools/check_refs.py
          hugo --gc --minify --panicOnWarning --destination /tmp/snowone-check >/dev/null

      - name: Branch and PR
        if: steps.existing.outputs.skip != 'true'
        id: pr
        env:
          BRANCH: ${{ steps.existing.outputs.branch }}
          EXISTING: ${{ steps.existing.outputs.pr }}
        run: |
          title=$(jq -r .title "$SUMMARY")
          cfp_id=$(jq -r .cfp_id "$SUMMARY")
          card_url=$(jq -r .cardUrl "$SUMMARY")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add content
          git commit -q -m "Приём в программу: $title" -m "Заявка $cfp_id, карточка $card_url"
          # Ветка cfp/<номер заявки> принадлежит этому workflow, поэтому пересоздание — принудительный push
          git push --force origin "$BRANCH"
          {
            echo "Выступление «$title» из карточки $card_url (заявка $cfp_id)."
            echo
            echo "Страницы:"
            jq -r '.created[] | "- `" + . + "`"' "$SUMMARY"
            if [ "$(jq '.notes | length' "$SUMMARY")" != "0" ]; then
              echo
              echo "**Проверьте:**"
              jq -r '.notes[] | "- " + .' "$SUMMARY"
            fi
            echo
            echo "Выступление публикуется без расписания: день, время и зал проставляются позже."
            echo "Проверки сайта (\`check_refs.py\`, сборка Hugo) пройдены в [запуске cfp-accept]($RUN_URL): PR от GitHub Actions не запускает их сам."
            echo
            echo "Если нужно поправить текст — правьте карточку и запустите cfp-accept вручную с «пересоздать», или правьте файлы прямо в этом PR."
          } > /tmp/pr-body.md
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "CFP: $title" --body-file /tmp/pr-body.md
            echo "url=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            url=$(gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
              --title "CFP: $title" --body-file /tmp/pr-body.md)
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: Report to the card and the chat
        if: steps.existing.outputs.skip != 'true'
        env:
          PR: ${{ steps.pr.outputs.url }}
        run: |
          python3 tools/cfp_from_trello.py comment --card "$CARD" --text "PR со страницами для сайта готов к ревью: $PR"
          jq -n --slurpfile s "$SUMMARY" --arg pr "$PR" \
            '{kind: "pr-ready", title: $s[0].title, cardUrl: $s[0].cardUrl, prUrl: $pr, notes: $s[0].notes}' > /tmp/event.json
          curl -fsS -X POST -H "Authorization: Bearer $EVENTS_SECRET" -H "Content-Type: application/json" \
            --data @/tmp/event.json "$CFP_SERVICE_URL/api/events"

      - name: Report the failure
        if: failure()
        run: |
          if [ -s "$SUMMARY" ] && [ "$(jq -r .ok "$SUMMARY")" = "false" ]; then
            message=$(jq -r .error "$SUMMARY")
          else
            message="сбой на шаге проверки или публикации, подробности в запуске"
          fi
          python3 tools/cfp_from_trello.py comment --card "$CARD" \
            --text "Не удалось собрать PR: $message Поправьте карточку и перенесите её в «Приняли в программу» ещё раз или запустите cfp-accept вручную. Запуск: $RUN_URL" || true
          jq -n --arg card "$CARD" --arg msg "$message" --arg run "$RUN_URL" --slurpfile s <( [ -s "$SUMMARY" ] && cat "$SUMMARY" || echo '{}' ) \
            '{kind: "error", title: ($s[0].title // $card), cardUrl: ($s[0].cardUrl // ("https://trello.com/c/" + $card)), message: $msg, runUrl: $run}' > /tmp/event.json
          curl -fsS -X POST -H "Authorization: Bearer $EVENTS_SECRET" -H "Content-Type: application/json" \
            --data @/tmp/event.json "$CFP_SERVICE_URL/api/events" || true
